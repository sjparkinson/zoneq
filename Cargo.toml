[package]
name = "zoneq"
edition = "2024"
rust-version = "1.98"
authors = ["Samuel Parkinson <samuel.parkinson@hey.com>"]
description = "Query zone files."
repository = "https://github.com/sjparkinson/zoneq"
readme = "README.md"
license = "MIT"

[[bench]]
name = "parse"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Release codegen with symbols, for samply and friends.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Keep symbols in benches too, so profiling a bench run is readable.
[profile.bench]
debug = true
strip = false
