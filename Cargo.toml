[package]
name = "zoneq"
edition = "2024"
rust-version = "1.98"
authors = ["Samuel Parkinson <samuel.parkinson@hey.com>"]
description = "Query zone files."
repository = "https://github.com/sjparkinson/zoneq"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dhat = { version = "0.3", optional = true }

[features]
# Counts heap allocations into dhat-heap.json. For profiling only.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
predicates = "3"

[[bench]]
name = "parse"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Release codegen with symbols, for samply and friends.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Keep symbols in benches too, so profiling a criterion run is readable.
[profile.bench]
debug = true
strip = false
