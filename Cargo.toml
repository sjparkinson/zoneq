[package]
name = "zoneq"
edition = "2024"
rust-version = "1.88"
authors = ["Samuel Parkinson <samuel.parkinson@hey.com>"]
description = "Query zone files."
repository = "https://github.com/sjparkinson/zoneq"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
predicates = "3"

[[bench]]
name = "parse"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
