name: ci

on:
  push:
    branches:
      - main
  pull_request: ~

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TERM: xterm-256color
  MSYSCON: mintty.exe

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: echo "::add-matcher::.github/rust-matchers.json"

      - name: Install Rust at rust-version from Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --component rustfmt
          rustup default "$msrv"

      - run: cargo fmt --check

  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      BIN: target/${{ matrix.target }}/release/zoneq${{ matrix.ext }}
      DIST: dist/zoneq-${{ matrix.target }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: echo "::add-matcher::.github/rust-matchers.json"

      - name: Install Rust at rust-version from Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --component clippy --target "$TARGET"
          rustup default "$msrv"

      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo clippy --all-targets --locked --target "$TARGET" -- -D warnings
      - run: cargo test --locked --target "$TARGET" -- --color always
      - run: cargo build --release --locked --target "$TARGET"

      - run: mkdir -p dist
      - run: cp "$BIN" "$DIST"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.DIST }}
          archive: false

      - if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.DIST }}

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parse
            seeds: tests/samples
          - target: resolve
            seeds: fuzz/seeds/resolve
          - target: query
            seeds: fuzz/seeds/query
          - target: name
            seeds: fuzz/seeds/name
    env:
      TARGET: ${{ matrix.target }}
      SEEDS: ${{ matrix.seeds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup toolchain install nightly --profile minimal

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            fuzz/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      # Carry the corpus between runs, so each one starts from what the last
      # found. Cache keys can't be overwritten, hence the run ID and prefix.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - run: command -v cargo-fuzz || cargo install cargo-fuzz --locked
      - run: mkdir -p "fuzz/corpus/$TARGET"
      - run: cargo +nightly fuzz run "$TARGET" "fuzz/corpus/$TARGET" "$SEEDS" -- -dict=fuzz/zone.dict -max_total_time=60

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  cargo-publish:
    name: cargo publish
    needs: [fmt, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: cargo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"

      - name: Stamp version
        run: |
          version="0.2.$(git rev-list --count HEAD)+$(git rev-parse --short HEAD)"
          sed -i "/^name = \"zoneq\"$/a version = \"$version\"" Cargo.toml

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  gh-release:
    name: gh release
    needs: [fmt, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zoneq-*
          path: dist
          merge-multiple: true

      # Tag without the +sha build metadata, which crates.io ignores too.
      - run: |
          count=$(git rev-list --count HEAD)
          gh release create "v0.2.$count" dist/* \
            --target "$GITHUB_SHA" \
            --title "0.2.$count+$(git rev-parse --short HEAD)" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
